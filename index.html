<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VA Lottery Keno · 3-Spot Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: #0f1117;
    color: #e8e6e0;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #e8e6e0;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 12px;
    color: #6b6a65;
    margin-bottom: 16px;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .stats-bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: #1c1e26;
    border-radius: 10px;
    padding: 10px 12px;
    border: 0.5px solid #2e2f38;
  }
  .stat-label {
    font-size: 10px;
    color: #6b6a65;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 600;
    color: #e8e6e0;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.positive { color: #34c97e; }
  .stat-value.negative { color: #e05252; }
  .stat-value.green-label { color: #34c97e; }
  .buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.7; }
  #btn-start {
    background: #378ADD;
    color: #fff;
  }
  #btn-start:disabled {
    background: #243a52;
    color: #4a6a88;
  }
  #btn-reset {
    background: #1c1e26;
    color: #e8e6e0;
    border: 0.5px solid #2e2f38;
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    height: 240px;
    background: #1c1e26;
    border-radius: 12px;
    border: 0.5px solid #2e2f38;
    padding: 12px;
    margin-bottom: 12px;
  }
  .legend {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 11px;
    color: #6b6a65;
    padding: 0 2px;
    margin-bottom: 12px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .legend-line {
    width: 22px;
    height: 2px;
    flex-shrink: 0;
  }
  .legend-line.solid { background: #378ADD; }
  .legend-line.dashed-green {
    background: repeating-linear-gradient(to right, #34c97e 0, #34c97e 5px, transparent 5px, transparent 9px);
  }
  .legend-line.dashed-amber {
    background: repeating-linear-gradient(to right, #c49a2a 0, #c49a2a 5px, transparent 5px, transparent 9px);
  }
  .payouts {
    background: #1c1e26;
    border-radius: 10px;
    border: 0.5px solid #2e2f38;
    padding: 10px 14px;
    font-size: 12px;
    color: #6b6a65;
    display: flex;
    justify-content: space-between;
  }
  .payout-item { text-align: center; }
  .payout-val { font-size: 15px; font-weight: 600; color: #e8e6e0; margin-bottom: 2px; }
  .payout-val.win { color: #34c97e; }
  .payout-val.lose { color: #e05252; }
</style>
</head>
<body>

<h1>VA Lottery Keno · 3-Spot</h1>
<p class="subtitle">1,000 trials · 80 balls · 20 drawn · $1 bet</p>

<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Trial</div>
    <div class="stat-value" id="stat-trial">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Running total</div>
    <div class="stat-value" id="stat-total">$0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Last result</div>
    <div class="stat-value" id="stat-last">—</div>
  </div>
</div>
<div class="stats-bottom">
  <div class="stat-card">
    <div class="stat-label">Avg win/loss</div>
    <div class="stat-value" id="stat-avg">$0.00</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Last above $0</div>
    <div class="stat-value" id="stat-green">—</div>
  </div>
</div>

<div class="buttons">
  <button id="btn-start" onclick="startSim()">▶ Start</button>
  <button id="btn-reset" onclick="resetSim()">↺ Reset</button>
</div>

<div class="chart-wrap">
  <canvas id="kenoChart" role="img" aria-label="Keno simulation average win/loss over 1000 trials"></canvas>
</div>

<div class="legend">
  <div class="legend-row"><span class="legend-line solid"></span> Average win/loss per trial</div>
  <div class="legend-row"><span class="legend-line dashed-green"></span> Expected avg loss (−$0.306)</div>
  <div class="legend-row"><span class="legend-line dashed-amber"></span> Break-even ($0.00)</div>
</div>

<div class="payouts">
  <div class="payout-item"><div class="payout-val win">$30</div><div>3 match</div></div>
  <div class="payout-item"><div class="payout-val win">$2</div><div>2 match</div></div>
  <div class="payout-item"><div class="payout-val lose">$0</div><div>0–1 match</div></div>
</div>

<script>
let chart, animFrame, simRunning = false;
const TRIALS = 1000;
const DURATION_MS = 30000;
const EXPECTED = -0.306;

function playKeno() {
  const balls = Array.from({length:80},(_,i)=>i+1);
  for(let i=balls.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[balls[i],balls[j]]=[balls[j],balls[i]];}
  const drawn = new Set(balls.slice(0,20));
  const picks = new Set();
  while(picks.size<3){picks.add(Math.floor(Math.random()*80)+1);}
  let matches=0;
  for(const p of picks) if(drawn.has(p)) matches++;
  if(matches===3) return 29;
  if(matches===2) return 1;
  return -1;
}

function buildResults() {
  const res=[];
  for(let i=0;i<TRIALS;i++) res.push(playKeno());
  return res;
}

function makeChart() {
  const ctx = document.getElementById('kenoChart');
  chart = new Chart(ctx, {
    type:'line',
    data:{
      labels:[],
      datasets:[
        {
          label:'Avg win/loss',
          data:[],
          borderColor:'#378ADD',
          borderWidth:2,
          pointRadius:0,
          tension:0.2,
          yAxisID:'y',
          order:1
        },
        {
          label:'Expected',
          data: Array.from({length:TRIALS},()=>EXPECTED),
          borderColor:'#34c97e',
          borderDash:[6,4],
          borderWidth:1.5,
          pointRadius:0,
          tension:0,
          yAxisID:'y',
          order:2
        },
        {
          label:'Break-even',
          data: Array.from({length:TRIALS},()=>0),
          borderColor:'#c49a2a',
          borderDash:[6,4],
          borderWidth:1.5,
          pointRadius:0,
          tension:0,
          yAxisID:'y',
          order:3
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{
          title:{display:false},
          ticks:{color:'#4a4a50',maxTicksLimit:7,font:{size:9}},
          grid:{color:'rgba(255,255,255,0.05)'}
        },
        y:{
          title:{display:false},
          ticks:{color:'#4a4a50',font:{size:9},callback:v=>(v>=0?'+':'')+`$${v.toFixed(2)}`},
          grid:{color:'rgba(255,255,255,0.05)'}
        }
      }
    }
  });
}

function setColor(id, val) {
  const el = document.getElementById(id);
  el.className = 'stat-value' + (val > 0 ? ' positive' : val < 0 ? ' negative' : '');
}

let results=[], startTime=null, lastIdx=-1, lastAboveZero=-1, runningTotal=0;

function tick(ts) {
  if(!startTime) startTime=ts;
  const elapsed = ts - startTime;
  const targetIdx = Math.min(Math.floor((elapsed/DURATION_MS)*TRIALS), TRIALS-1);

  if(targetIdx > lastIdx) {
    for(let i=lastIdx+1;i<=targetIdx;i++) {
      runningTotal += results[i];
      const avg = runningTotal/(i+1);
      chart.data.labels.push(i+1);
      chart.data.datasets[0].data.push(avg);
      if(avg > 0) lastAboveZero = i+1;
    }
    chart.update('none');
    lastIdx = targetIdx;

    const avg = runningTotal/(lastIdx+1);
    const lastVal = results[lastIdx];

    document.getElementById('stat-trial').textContent = lastIdx+1;

    const totEl = document.getElementById('stat-total');
    totEl.textContent = (runningTotal>=0?'+':'')+`$${runningTotal}`;
    setColor('stat-total', runningTotal);

    const avgEl = document.getElementById('stat-avg');
    avgEl.textContent = (avg>=0?'+':'')+`$${avg.toFixed(2)}`;
    setColor('stat-avg', avg);

    const lastEl = document.getElementById('stat-last');
    lastEl.textContent = (lastVal>0?'+':'')+`$${lastVal}`;
    setColor('stat-last', lastVal);

    const greenEl = document.getElementById('stat-green');
    if(lastAboveZero > 0) {
      greenEl.textContent = `#${lastAboveZero}`;
      greenEl.className = 'stat-value green-label';
    } else {
      greenEl.textContent = 'Never';
      greenEl.className = 'stat-value negative';
    }
  }

  if(elapsed < DURATION_MS && lastIdx < TRIALS-1) {
    animFrame = requestAnimationFrame(tick);
  } else {
    simRunning=false;
    document.getElementById('btn-start').textContent='▶ Start';
    document.getElementById('btn-start').disabled=false;
  }
}

function startSim() {
  if(simRunning) return;
  if(lastIdx >= TRIALS-1) resetSim();
  simRunning=true;
  document.getElementById('btn-start').disabled=true;
  document.getElementById('btn-start').textContent='Running…';
  if(results.length===0) results=buildResults();
  if(!chart) makeChart();
  startTime=null;
  animFrame=requestAnimationFrame(tick);
}

function resetSim() {
  if(animFrame) cancelAnimationFrame(animFrame);
  simRunning=false; lastIdx=-1; startTime=null; results=[]; lastAboveZero=-1; runningTotal=0;
  if(chart){
    chart.data.labels=[];
    chart.data.datasets[0].data=[];
    chart.update('none');
  }
  ['stat-trial','stat-total','stat-avg','stat-last','stat-green'].forEach(id=>{
    const el=document.getElementById(id);
    el.className='stat-value';
    el.textContent = id==='stat-trial'?'0': id==='stat-total'?'$0': id==='stat-avg'?'$0.00':'—';
  });
  document.getElementById('btn-start').disabled=false;
  document.getElementById('btn-start').textContent='▶ Start';
}

makeChart();
</script>
</body>
</html>
